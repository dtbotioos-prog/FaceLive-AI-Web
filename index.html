<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>FaceLive AI Web</title><style>body{margin:0;background:#0b1020;color:#f8fafc;font:16px system-ui}main{max-width:540px;margin:auto;padding:20px}video,canvas{width:100%;aspect-ratio:9/16;object-fit:cover;background:#111827;border-radius:18px}button,input{font:inherit;margin:8px 4px;padding:12px;border-radius:10px}button{background:#38bdf8;border:0;color:#07111e;font-weight:700}button:disabled{opacity:.4}.hint{color:#cbd5e1}#preview{max-width:100px;max-height:100px;object-fit:contain}</style></head><body><main><h1>FaceLive AI Web</h1><p class="hint">Прототип камеры и распознавания лица. Реалистичная замена лица ещё не подключена.</p><video id="camera" autoplay muted playsinline></video><canvas id="overlay" hidden></canvas><p><button id="start">Включить камеру</button><button id="stop" disabled>Остановить</button></p><label>Выбрать фотографию лица <input type="file" id="photo" accept="image/*"></label><img id="preview" alt="Выбранное фото" hidden><p id="status" role="status">Камера выключена.</p><p class="hint">Работает локально в Safari. Видео и выбранная фотография не отправляются на сервер. Не подменяет камеру TikTok или Instagram.</p></main><script src="app.js" defer></script></body></html>
