<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>FaceLive AI</title></head><body><main><h1>FaceLive AI</h1><p>Камера и геометрическое наложение лица по фотографии</p><div class="stage"><video id="video" autoplay muted playsinline></video><canvas id="canvas"></canvas></div><div class="buttons"><button id="start">Запустить камеру</button><button id="stop">Остановить</button></div><label>Лицо для наложения <input id="photo" type="file" accept="image/*"></label><div class="preview"><img id="source" src="default-face.jpg" alt="Выбранное лицо"><span>Фото по умолчанию загружено</span></div><label>Сила наложения <input id="opacity" type="range" min="0" max="100" value="92"><output id="percent">92%</output></label><label><input id="overlay" type="checkbox" checked> Накладывать лицо</label><label><input id="points" type="checkbox"> Показывать точки лица</label><p id="status" role="status">Ожидание запуска</p><small>Демонстрация: 2D-наложение с отслеживанием лица, не нейросетевой deepfake. Не заменяет камеру TikTok/Instagram.</small></main><script type="module" src="app.js"></script></body></html>
